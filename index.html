<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">

    <title>Login Page</title>
</head>

<body>

    <div class="container" id="container">

        <!-- SIGN UP -->
        <div class="form-container sign-up">
            <form>

                <h1>Create Account</h1>

                <div class="social-icon">

                    <a href="#" class="icon">
                        <i class="fa-brands fa-google-plus-g"></i>
                    </a>

                    <a href="#" class="icon">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="https://github.com/Rishabhk2004" class="icon">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="https://www.linkedin.com/in/rishabh-kumar-939052241/" class="icon">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                </div>

                <span>
                    or use your email for the registration
                </span>

                <input type="text" placeholder="Name">

                <input type="email" placeholder="Email">

                <input type="password" placeholder="Password">

                <button>Sign Up</button>

            </form>
        </div>


        <!-- SIGN IN -->
        <div class="form-container sign-in">
            <form>

                <h1>Sign In</h1>

                <div class="social-icon">

                    <a href="#" class="icon">
                        <i class="fa-brands fa-google-plus-g"></i>
                    </a>

                    <a href="#" class="icon">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="https://github.com/Rishabhk2004" class="icon">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="https://www.linkedin.com/in/rishabh-kumar-939052241/" class="icon">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>

                </div>

                <span>
                    or use your email or password
                </span>

                <input type="email" placeholder="Email">

                <input type="password" placeholder="Password">

                <a href="#">Forget Your Password?</a>

                <button>Sign In</button>

            </form>
        </div>


        <!-- TOGGLE PANEL -->

        <!-- TOGGLE LEFT -->
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-pannel
                 toggle-left">

                    <h1>Welcome Back!</h1>

                    <p>
                        Enter your personal details to use
                        all of the site features
                    </p>

                    <button class="hidden" id="login">
                        Sign In
                    </button>

                </div>


                <!-- TOGGLE RIGHT -->
                <div class="toggle-pannel
                 toggle-right">

                    <h1>Hello Friends!</h1>

                    <p>
                        Register your personal details to use
                        all of the site features
                    </p>

                    <button class="hidden" id="registration">
                        Sign Up
                    </button>

                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>

</body>

</html>
